apiVersion: platform.mujak.com/v1alpha1
kind: XIngressTLSCustom
metadata:
  name: tls-ingress-custom-demo
  namespace: default
spec:
  crossplane:
    compositionRef:
      name: xingresstls-custom.platform.mujak.com
  hostname: app-custom.mujak.com
  ingress:
    className: nginx
    serviceName: app
    servicePort: 8080
  certificate:
    issuerRef:
      name: letsencrypt-prod
      kind: ClusterIssuer
