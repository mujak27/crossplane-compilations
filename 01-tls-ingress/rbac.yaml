apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: crossplane:compose:tls-ingress
  labels:
    rbac.crossplane.io/aggregate-to-crossplane: "true"
rules:
  - apiGroups:
      - cert-manager.io
    resources:
      - certificates
      - certificates/status
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups:
      - networking.k8s.io
    resources:
      - ingresses
      - ingresses/status
    verbs: [get, list, watch, create, update, patch, delete]
