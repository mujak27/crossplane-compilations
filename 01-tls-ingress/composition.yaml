apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: xingresstls.platform.mujak.com

spec:
  compositeTypeRef:
    apiVersion: platform.mujak.com/v1alpha1
    kind: XIngressTLS

  mode: Pipeline

  pipeline:
    - step: render
      functionRef:
        name: function-go-templating

      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate

        source: Inline

        inline:

          template: |
            {{- $xr := .observed.composite.resource -}}
            {{- $name := $xr.metadata.name -}}
            {{- $namespace := $xr.metadata.namespace -}}
            {{- $hostname := $xr.spec.hostname -}}
            {{- $secretName := printf "%s-tls" $name -}}

            {{- $cert := getComposedResource . "certificate" | default dict -}}
            {{- $certStatus := $cert.status | default dict -}}
            {{- $certMetadata := $cert.metadata | default dict -}}
            {{- $readyCondition := getResourceCondition "Ready" $cert -}}
            {{- $current := false -}}
            {{- $found := false -}}
            {{- range ($certStatus.conditions | default list) -}}
              {{- if and (not $found) (eq .type "Ready") -}}
                {{- $found = true -}}
                {{- $current = and (not (empty $certMetadata.generation)) (not (empty .observedGeneration)) (eq (toJson $certMetadata.generation) (toJson .observedGeneration)) -}}
              {{- end -}}
            {{- end -}}

            {{- $ready := false -}}
            {{- $health := "Pending" -}}
            {{- $notAfter := $certStatus.notAfter | default "" -}}
            {{- $daysRemaining := 0 -}}
            {{- if $notAfter -}}
              {{- $expiry := toDate "2006-01-02T15:04:05.999999999Z07:00" $notAfter -}}
              {{- $now := now -}}
              {{- $secondsRemaining := sub ($expiry.Unix) ($now.Unix) -}}
              {{- $daysRemaining = div $secondsRemaining 86400 -}}
              {{- $ready = and $current (eq $readyCondition.Status "True") ($expiry.After $now) -}}
              {{- if not ($expiry.After $now) -}}
                {{- $health = "Expired" -}}
              {{- else if le $daysRemaining 15 -}}
                {{- $health = "Warning" -}}
              {{- else if $ready -}}
                {{- $health = "Healthy" -}}
              {{- end -}}
            {{- end -}}

            {{- $backend := dict "service" (dict "name" $xr.spec.ingress.serviceName "port" (dict "number" $xr.spec.ingress.servicePort)) -}}
            {{- $paths := list (dict "path" "/" "pathType" "Prefix" "backend" $backend) -}}
            {{- $rules := list (dict "host" $hostname "http" (dict "paths" $paths)) -}}
            {{- $tls := list (dict "hosts" (list $hostname) "secretName" $secretName) -}}
            {{- $ingressSpec := dict "rules" $rules "tls" $tls -}}
            {{- $class := $xr.spec.ingress.className | default "" -}}
            {{- if $class -}}
              {{- $_ := set $ingressSpec "ingressClassName" $class -}}
            {{- end -}}
            {{- $ingress := getComposedResource . "ingress" | default dict -}}
            {{- $observedSpec := $ingress.spec | default dict -}}
            {{- /* JSON comparison preserves full rules/TLS shape and normalizes integral numeric values. */ -}}
            {{- $ingressReady := and (eq (toJson $observedSpec.rules) (toJson $rules)) (eq (toJson $observedSpec.tls) (toJson $tls)) -}}
            {{- if $class -}}
              {{- $ingressReady = and $ingressReady (eq $observedSpec.ingressClassName $class) -}}
            {{- end -}}

            ---
            apiVersion: cert-manager.io/v1
            kind: Certificate
            metadata:
              name: {{ $name }}
              namespace: {{ $namespace }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: certificate
                {{- if $ready }}
                gotemplating.fn.crossplane.io/ready: "True"
                {{- end }}

            spec:
              secretName: {{ $secretName }}

              dnsNames:
                - {{ $hostname }}

              issuerRef:
                name: {{ $xr.spec.certificate.issuerRef.name }}
                kind: {{ $xr.spec.certificate.issuerRef.kind }}
                group: cert-manager.io

            ---
            apiVersion: networking.k8s.io/v1
            kind: Ingress
            metadata:
              name: {{ $name }}
              namespace: {{ $namespace }}

              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: ingress
                {{- if $ingressReady }}
                gotemplating.fn.crossplane.io/ready: "True"
                {{- end }}
                {{- if $notAfter }}
                platform.mujak.com/cert-not-after: {{ $notAfter | quote }}
                {{- end }}

            spec:
              {{- $ingressSpec | toYaml | nindent 2 }}

            ---
            apiVersion: platform.mujak.com/v1alpha1
            kind: XIngressTLS

            status:
              certificate:
                ready: {{ $ready }}
                health: {{ $health | quote }}
                daysRemaining: {{ $daysRemaining }}

                {{- if $notAfter }}
                notAfter: {{ $notAfter | quote }}
                {{- end }}
