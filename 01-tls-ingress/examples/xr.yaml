apiVersion: platform.mujak.com/v1alpha1
kind: XIngressTLS
metadata:
  name: tls-ingress-demo
  namespace: default

spec:
  crossplane:
    compositionRef:
      name: xingresstls.platform.mujak.com
  hostname: app.mujak.com

  ingress:
    className: nginx
    serviceName: app
    servicePort: 8080

  certificate:
    issuerRef:
      name: letsencrypt-prod
      kind: ClusterIssuer
