apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: tls-ingress-demo
  namespace: default
  generation: 1
  annotations:
    crossplane.io/composition-resource-name: certificate
spec:
  secretName: tls-ingress-demo-tls
  dnsNames: [app.mujak.com]
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
    group: cert-manager.io
status:
  conditions:
    - type: Ready
      status: "True"
      observedGeneration: 1
  notAfter: "2099-01-01T00:00:00Z"
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tls-ingress-demo
  namespace: default
  annotations:
    crossplane.io/composition-resource-name: ingress
spec:
  ingressClassName: nginx
  tls:
    - hosts: [app.mujak.com]
      secretName: tls-ingress-demo-tls
  rules:
    - host: app.mujak.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app
                port:
                  number: 8080
status:
  loadBalancer: {}
