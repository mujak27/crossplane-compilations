name: TLS ingress template

on:
  pull_request:
    paths:
      - '01-tls-ingress/**'
      - '.github/workflows/tls-ingress-template.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Crossplane CLI
        env:
          CROSSPLANE_VERSION: v2.5.0
          CROSSPLANE_SHA256: 065dd6b40c9ea5fc71e49900d5c924cc0bec7f58375922ddbde6b402f292347e
        run: |
          curl --fail --silent --show-error --location \
            "https://cli.crossplane.io/stable/${CROSSPLANE_VERSION}/bin/linux_amd64/crossplane" \
            --output "${RUNNER_TEMP}/crossplane"
          echo "${CROSSPLANE_SHA256}  ${RUNNER_TEMP}/crossplane" | sha256sum --check
          chmod +x "${RUNNER_TEMP}/crossplane"
          echo "${RUNNER_TEMP}" >> "$GITHUB_PATH"

      - name: Test provisioning readiness
        run: |
          python3 -m venv "${RUNNER_TEMP}/venv"
          "${RUNNER_TEMP}/venv/bin/pip" install PyYAML==6.0.3
          "${RUNNER_TEMP}/venv/bin/python" 01-tls-ingress/tests/test_readiness.py -v
